[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-qa-agent"
version = "0.1.0"
description = "Multi-turn financial QA via a four-step LLM reasoning pipeline with rigorous evaluation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30",
    "openai>=1.35",
    "groq>=0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_qa", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov=api --cov-report=term-missing"
